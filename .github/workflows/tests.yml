name: Test suite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      EL_SECRETARIO_SKIP_AUDIO_ENUM: "1"
      POSTHOG_DISABLED: "1"
      ANONYMIZED_TELEMETRY: "False"
      TQDM_DISABLE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies for headless Qt and audio tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-3 libegl1 libgl1 libportaudio2 libpulse0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the full test suite
        run: python -m pytest -q
